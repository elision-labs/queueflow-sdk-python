name: QueueFlow Python SDK CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [core-updated]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    services:
      queueflow:
        image: queueflow/core:latest
        ports:
          - 8080:8080
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/queueflow
          API_KEY: test_api_key
        options: >-
          --health-cmd "curl -f http://localhost:8080/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queueflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        flake8 queueflow tests
    
    - name: Type check with mypy
      run: |
        mypy queueflow
    
    - name: Format check with black
      run: |
        black --check queueflow tests
    
    - name: Import sorting check with isort
      run: |
        isort --check-only queueflow tests
    
    - name: Run tests
      run: |
        pytest --cov=queueflow --cov-report=xml --cov-report=term-missing
      env:
        QUEUEFLOW_URL: http://localhost:8080
        QUEUEFLOW_API_KEY: test_api_key
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  integration-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Start QueueFlow with Docker Compose
      run: |
        curl -L https://raw.githubusercontent.com/queueflow/queueflow-infra/main/docker/docker-compose.yaml -o docker-compose.yaml
        docker-compose up -d
        sleep 30
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
      env:
        QUEUEFLOW_URL: http://localhost:8080
        QUEUEFLOW_API_KEY: dev_api_key_12345

  publish:
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Publish to TestPyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        twine upload --repository testpypi dist/*
    
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*