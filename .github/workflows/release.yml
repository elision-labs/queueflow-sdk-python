name: Release

# Publish the `queueflow` package to PyPI when a v* tag is pushed.
#
# Auth: the PYPI_API_TOKEN repository secret (a PyPI API token scoped to the
# queueflow project). Alternatively register this repo and workflow as a
# Trusted Publisher on pypi.org, delete the secret, and remove the `password`
# line below: the action then authenticates with GitHub's OIDC token.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + twine upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches pyproject.toml
        run: |
          v="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "v${v}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != pyproject version ${v}" >&2; exit 1; }
      - run: python -m pip install -q build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
