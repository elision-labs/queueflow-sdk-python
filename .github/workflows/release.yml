name: Release

# Publish the `queueflow` package to PyPI when a v* tag is pushed.
#
# Auth is PyPI Trusted Publishing: this repo and workflow are registered as
# a trusted publisher for the queueflow project on pypi.org, and the id-token
# permission lets the publish action exchange GitHub's OIDC token for a
# short-lived upload credential. No API token secret is used.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + publish (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches pyproject.toml
        run: |
          v="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "v${v}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != pyproject version ${v}" >&2; exit 1; }
      - run: python -m pip install -q build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
